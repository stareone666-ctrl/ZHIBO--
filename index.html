<body>
  <nav class="tool-dock" aria-label="工具导航">

      <button class="dock-item" type="button" aria-disabled="true" title="积分榜工具即将上线"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 20h8M12 16v4M6 4h12v4a6 6 0 0 1-12 0V4Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 6H3.5v1.5A3.5 3.5 0 0 0 7 11m11-5h2.5v1.5A3.5 3.5 0 0 1 17 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span class="dock-copy"><strong>积分榜</strong><small>即将上线</small></span></button>
    </div>

  <main class="app">
<header class="topbar"><div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3v3m10-3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></div><div><h1 id="toolTitle">培训日程卡</h1><p id="toolSubtitle">编辑内容自动保存，实时生成可分享卡片</p></div></div><div class="actions" id="scheduleActions"><div class="theme-switch" aria-label="主题"><button id="darkBtn" aria-label="深色主题">☾ <span>深色</span></button><button id="lightBtn" aria-label="浅色主题">☀ <span>浅色</span></button></div><button class="btn" id="resetBtn" title="恢复示例"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>重置</span></button><button class="btn primary" id="exportBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>导出 PNG</span></button></div><div class="actions" id="posterActions" hidden><div class="theme-switch" aria-label="交付长图主题"><button id="posterDarkBtn" aria-label="深色主题">☾ <span>深色</span></button><button id="posterLightBtn" aria-label="浅色主题">☀ <span>浅色</span></button></div><button class="btn" id="posterLoadBtn"><span>导入工程</span></button><button class="btn" id="posterSaveBtn"><span>保存工程</span></button><button class="btn" id="posterSlicesBtn"><span>导出切图</span></button><button class="btn primary" id="posterExportBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>导出 PNG 长图</span></button></div></header>
    <div class="tool-pane" id="scheduleToolView"><div class="layout-tools"><span>拖动分隔条调整预览比例，导出图片与预览一致</span><button id="resetLayout" type="button">恢复默认宽度</button></div>
    <div class="workspace">
      <aside class="panel editor" id="editorPanel">
        <section class="section"><div class="section-head"><h2>卡片信息</h2><span class="hint">实时预览</span></div><div class="field"><label for="titleInput">培训标题（支持回车换行）</label><textarea id="titleInput" rows="2"></textarea></div><div class="field"><label>标题对齐方式</label><div class="note-align" role="group" aria-label="标题对齐方式"><button type="button" data-title-align="left">左对齐</button><button type="button" data-title-align="center">居中</button><button type="button" data-title-align="right">右对齐</button></div></div><div class="date-grid"><div class="field"><label for="titleFontInput">标题字体</label><select id="titleFontInput"><option value="sans">默认黑体</option><option value="pingfang">苹方</option><option value="yahei">微软雅黑</option><option value="song">宋体</option><option value="kai">楷体</option><option value="hei">黑体</option><option value="custom">自定义字体名称</option></select></div><div class="field"><label for="titleSizeInput">标题字号（px，16–96）</label><input id="titleSizeInput" type="number" min="16" max="96" step="1" /></div></div><div class="field"><label for="titleColorInput">标题颜色</label><div class="title-color-controls"><input id="titleColorInput" type="color" value="#ffffff" /><button class="btn" id="resetTitleColor" type="button">跟随主题</button></div></div><div class="field" id="customFontField" hidden><label for="customFontInput">本机已安装的字体名称</label><input id="customFontInput" placeholder="例如：华文行楷" /><span class="hint">未安装的字体会使用默认字体显示</span></div><div class="date-grid"><div class="field"><label for="startDateInput">开始日期</label><input id="startDateInput" type="date" /></div><div class="field"><label for="endDateInput">结束日期</label><input id="endDateInput" type="date" /></div></div><div class="field"><label for="locationInput">地点</label><input id="locationInput" /></div><div class="field"><label for="noteInput">备注</label><textarea id="noteInput"></textarea><div class="note-format-grid"><div class="field"><label>对齐方式</label><div class="note-align" role="group" aria-label="备注对齐方式"><button type="button" data-note-align="left">左对齐</button><button type="button" data-note-align="center">居中</button><button type="button" data-note-align="right">右对齐</button></div></div><div class="field"><label for="noteSizeInput">备注字号（px，12–36）</label><input id="noteSizeInput" type="number" min="12" max="36" step="1" /></div><div class="field"><label for="noteColorInput">备注颜色</label><div class="note-color-controls"><input id="noteColorInput" type="color" value="#ffffff" /><button class="btn" id="resetNoteColor" type="button">跟随主题</button></div></div></div></div></section>
        <section class="section"><div class="section-head"><h2>客户 Logo</h2><span class="hint">位置与大小可调整</span></div><div class="logo-tools"><label class="upload">上传 / 更换 Logo<input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" /></label><a class="btn" href="https://www.iconfont.cn/search/index?searchType=icon&amp;q=%E4%B8%AD%E5%8E%9F%E9%93%B6%E8%A1%8C&amp;page=1&amp;fromCollection=-1" target="_blank" rel="noopener noreferrer" title="打开 iconfont 中原银行图标库">打开图标库 ↗</a><button class="btn" id="removeLogo" type="button" hidden>移除 Logo</button></div><span class="hint">支持 PNG、JPG、WebP、SVG，推荐透明背景</span><div class="logo-format-grid"><div class="field"><label>Logo 对齐方式</label><div class="logo-align" role="group" aria-label="Logo 对齐方式"><button type="button" data-logo-align="left">靠左</button><button type="button" data-logo-align="center">居中</button><button type="button" data-logo-align="right">靠右</button></div></div><div class="field"><label for="logoSizeInput">Logo 大小</label><div class="range-row"><input id="logoSizeInput" type="range" min="60" max="320" step="5" value="180" /><span class="range-value" id="logoSizeValue">180</span></div></div></div></section>
        <section class="section"><div class="section-head"><h2>背景图片</h2><span class="hint">自动模糊处理</span></div><label class="upload">点击更换背景图片<input id="bgInput" type="file" accept="image/*" /></label><div class="field" style="margin-top:13px"><label for="blurInput">背景模糊度（0% 无模糊）</label><div class="range-row"><input id="blurInput" type="range" min="0" max="100" step="1" value="55" /><span class="range-value" id="blurValue">55%</span></div></div><div class="field"><label for="overlayInput">遮罩强度（0% 显示背景原色）</label><div class="range-row"><input id="overlayInput" type="range" min="0" max="100" step="1" value="0" /><span class="range-value" id="overlayValue">0%</span></div></div></section>
        <section class="section"><div class="section-head"><h2>课程安排</h2><span class="hint">完整课程信息</span></div><div class="schedule-head"><span>时间</span><span>事项</span><span>内容</span><span>授课人</span><span></span></div><div class="schedule-list" id="scheduleEditor"></div><button class="btn add" id="addBtn">＋ 添加一项</button></section>
      </aside>
      <div class="splitter" id="panelSplitter" role="separator" tabindex="0" aria-label="调整卡片信息与预览宽度" aria-orientation="vertical" aria-controls="editorPanel previewPanel" title="左右拖动调整宽度；双击恢复默认；方向键微调"><span aria-hidden="true">↔</span></div>
      <section class="panel stage" id="previewPanel"><article class="card" id="card"><div class="bg" id="bg"></div><div class="veil"></div><div class="glow"></div><div class="card-inner"><div><img class="card-logo" id="cardLogo" alt="客户 Logo" hidden /><h2 class="title" id="cardTitle"></h2><div class="meta"><span class="pill" id="cardDate"></span><span class="pill" id="cardLocation"></span></div></div><div class="agenda" id="agenda"></div><section class="note-card" id="noteCard"><p class="footer-note" id="cardNote"></p></section></div></article></section>
    </div></div>
    <iframe class="tool-view-frame tool-pane" id="posterToolFrame" title="交付长图工具" hidden></iframe>
  </main><div class="toast" id="toast"></div>
  <script>
    const sample={title:'商丘邮政分公司培训',startDate:'2026-08-26',endDate:'2026-08-28',location:'培训中心 · 集合地点见通知',note:'课程期间提供茶歇与水果，请合理安排休息并留意自身身体状况。',blur:22,bg:'',theme:'dark',items:[['09:00—09:30','签到','学员报到与资料领取','会务组'],['09:30—09:50','仪式','开班仪式','主持人'],['09:50—10:00','致辞','领导致辞','公司领导'],['10:00—12:00','团建','团队拓展训练','拓展教练'],['12:00—14:30','休息','午餐与午休','—'],['14:30—18:00','培训','综合素质提升','培训讲师'],['19:30—21:00','活动','团建晚会','会务组']]};
    function guessPeriod(time){const match=String(time).match(/^(\d{1,2})[:：]/);if(!match)return '上午';const hour=Number(match[1]);return hour<6?'凌晨':hour<12?'上午':hour<14?'中午':hour<18?'下午':'晚上'}
    let raw=JSON.parse(localStorage.getItem('training-card')||'null');function migrate(s){if(!s)s=structuredClone(sample);if(!s.startDate){s.startDate='2026-08-26';s.endDate='2026-08-28'}s.theme=s.theme||'dark';s.logoAlign=['left','center','right'].includes(s.logoAlign)?s.logoAlign:'left';s.logoSize=Math.max(60,Math.min(320,Number(s.logoSize)||180));s.items=(s.items||[]).map(x=>{const row=x.length>=4?[...x]:[x[0]||'',x[1]||'事项',x[1]||'',x[2]||'待填写'];if(row[4]===undefined)row[4]=s.startDate;if(row[5]===undefined)row[5]=guessPeriod(row[0]);return row});return s}let state=migrate(raw);const $=s=>document.querySelector(s);
    function save(){localStorage.setItem('training-card',JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function defaultBg(){return `radial-gradient(circle at 25% 22%,#8b5cf6 0,transparent 25%),radial-gradient(circle at 78% 28%,#38bdf8 0,transparent 24%),radial-gradient(circle at 60% 82%,#ec4899 0,transparent 30%),linear-gradient(140deg,#10162b,#1e293b)`}function fmtDate(v){if(!v)return'';const d=new Date(v+'T00:00:00');return`${d.getMonth()+1}月${d.getDate()}日`}function dateLabel(){return state.endDate&&state.endDate!==state.startDate?fmtDate(state.startDate)+'—'+fmtDate(state.endDate):fmtDate(state.startDate)}
    function dateGroups(items){const groups=[];items.forEach((item,index)=>{const last=groups.at(-1);if(last&&item[4]&&last.date===item[4])last.count++;else groups.push({date:item[4]||'',start:index,count:1})});return groups}
    function periodGroups(items){const groups=[];dateGroups(items).forEach(day=>{let last=null;for(let index=day.start;index<day.start+day.count;index++){const period=items[index][5]||'';if(last&&period&&last.period===period)last.count++;else{last={period,start:index,count:1};groups.push(last)}}});return groups}
    function agendaHtml(){
      if(!state.items.length)return '<div class="empty">添加课程后将在这里显示</div>';
      const periods=new Map(periodGroups(state.items).map(group=>[group.start,group]));
      return '<table class="agenda-table"><colgroup><col style="width:14%"><col style="width:9%"><col style="width:19%"><col style="width:11%"><col style="width:33%"><col style="width:14%"></colgroup><thead><tr>'+['日期','时段','时间','事项','课程内容','授课人'].map(t=>'<th scope="col">'+t+'</th>').join('')+'</tr></thead>'+dateGroups(state.items).map(group=>'<tbody>'+state.items.slice(group.start,group.start+group.count).map((item,index)=>'<tr>'+(index===0?'<th class="merged-date time" scope="rowgroup" rowspan="'+group.count+'">'+esc(fmtDate(group.date))+'</th>':'')+(periods.has(group.start+index)?'<td class="merged-period time" rowspan="'+periods.get(group.start+index).count+'">'+esc(item[5])+'</td>':'')+'<td class="time">'+esc(item[0])+'</td><td class="matter">'+esc(item[1])+'</td><td class="course">'+esc(item[2])+'</td><td class="teacher">'+esc(item[3])+'</td></tr>').join('')+'</tbody>').join('')+'</table>';
    }
    function applyTheme(){applyTitleColor();applyNoteStyle();document.documentElement.dataset.theme=state.theme;document.body.classList.toggle('light',state.theme==='light');$('#card').classList.toggle('light-card',state.theme==='light');$('#darkBtn').classList.toggle('active',state.theme==='dark');$('#lightBtn').classList.toggle('active',state.theme==='light')}

    const posterFrame=$('#posterToolFrame'),scheduleView=$('#scheduleToolView');
    const scheduleActions=$('#scheduleActions'),posterActions=$('#posterActions');
    const scheduleNav=$('#scheduleNav'),posterNav=$('#posterNav');
    let posterReady=false,currentTool=null,switchRevision=0;
    function posterControl(selector){return posterFrame.contentDocument?.querySelector(selector)}
    function clickPosterControl(selector){posterControl(selector)?.click()}
    function setPosterThemeButtons(theme){$('#posterDarkBtn').classList.toggle('active',theme==='dark');$('#posterLightBtn').classList.toggle('active',theme==='light')}
    function setUnifiedTheme(theme){state.theme=theme;applyTheme();save();clickPosterControl(theme==='dark'?'#darkUiBtn':'#lightUiBtn');setPosterThemeButtons(theme)}
    $('#posterDarkBtn').onclick=()=>setUnifiedTheme('dark');
    $('#posterLightBtn').onclick=()=>setUnifiedTheme('light');
    $('#posterLoadBtn').onclick=()=>clickPosterControl('#load');
    $('#posterSaveBtn').onclick=()=>clickPosterControl('#save');
    $('#posterSlicesBtn').onclick=()=>clickPosterControl('#exportSlices');
    $('#posterExportBtn').onclick=()=>clickPosterControl('#export');
    function updateSharedHeader(poster){
      $('#toolTitle').textContent=poster?'交付长图':'培训日程卡';
      $('#toolSubtitle').textContent=poster?'编辑内容自动保存，实时生成交付长图':'编辑内容自动保存，实时生成可分享卡片';
      scheduleActions.hidden=poster;posterActions.hidden=!poster;
      scheduleNav.classList.toggle('active',!poster);posterNav.classList.toggle('active',poster);
      scheduleNav.toggleAttribute('aria-current',!poster);posterNav.toggleAttribute('aria-current',poster);
      scheduleNav.querySelector('small').textContent=poster?'打开工具':'当前工具';
      posterNav.querySelector('small').textContent=poster?'当前工具':'打开工具';
      $('.brand').animate([{opacity:.72,transform:'translateY(-2px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,easing:'ease-out'});
    }
    function preparePoster(){
      if(posterReady)return;
      const sharedShellCss='<style>header{display:none!important}body{padding-top:0!important}.workspace{height:calc(100vh - 10px)!important}</style>';
      posterFrame.addEventListener('load',()=>{clickPosterControl(state.theme==='dark'?'#darkUiBtn':'#lightUiBtn');setPosterThemeButtons(state.theme)},{once:true});
      posterFrame.srcdoc=posterSource.replace('href="../index.html"','href="#schedule" target="_parent"').replace('</head>',sharedShellCss+'</head>');
      posterReady=true;
    }
    async function showSelectedTool(){
      const poster=location.hash==='#delivery-poster',next=poster?'poster':'schedule';
      if(currentTool===next)return;
      const revision=++switchRevision,outgoing=currentTool==='poster'?posterFrame:currentTool==='schedule'?scheduleView:null;
      if(outgoing){try{await outgoing.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(5px)'}],{duration:130,easing:'ease-in'}).finished}catch(e){}}
      if(revision!==switchRevision)return;
      scheduleView.hidden=poster;posterFrame.hidden=!poster;
      document.body.classList.toggle('poster-mode',poster);
      document.title=poster?'交付长图 · 交付工具箱':'培训日程卡';
      updateSharedHeader(poster);
      if(poster){preparePoster();clickPosterControl(state.theme==='dark'?'#darkUiBtn':'#lightUiBtn')}else requestAnimationFrame(applyPanelWidth);
      const incoming=poster?posterFrame:scheduleView;
      incoming.animate([{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});
      currentTool=next;
      try{localStorage.setItem('toolbox-last-tool',next)}catch(e){}
    }
    if(!['#schedule','#delivery-poster'].includes(location.hash)){let lastTool='schedule';try{lastTool=localStorage.getItem('toolbox-last-tool')||'schedule'}catch(e){}history.replaceState(null,'',lastTool==='poster'?'#delivery-poster':'#schedule')}
    setPosterThemeButtons(state.theme);
    scheduleNav.addEventListener('click',()=>setTimeout(showSelectedTool,0));
    posterNav.addEventListener('click',()=>setTimeout(showSelectedTool,0));
    window.addEventListener('hashchange',showSelectedTool);showSelectedTool();preparePoster();
  </script>
